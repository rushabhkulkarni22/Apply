services:
  proxy:
    image: caddy:2-alpine
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?Set PUBLIC_HOSTNAME to your domain without https://}
      TLS_EMAIL: ${TLS_EMAIL:?Set TLS_EMAIL to your certificate contact email}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - proxy_config:/config
    depends_on:
      - web
    restart: unless-stopped
volumes:
  certificates:
  proxy_config:
